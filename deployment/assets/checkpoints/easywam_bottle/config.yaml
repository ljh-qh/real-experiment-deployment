# @package _global_

defaults:
  - override /data: bottle_easywam
  - override /model: easywam_mot_joint_cosmos25_bottle
  - _self_

batch_size: 2
num_workers: 4

lr_scheduler_type: cosine
learning_rate: 1e-4
warmup_ratio: 0.05
# 188 eps / 210041 windows, batch 2 x 8 ranks x accum 8 = 128 -> 5 epochs
max_steps: 8205
log_every: 1
save_every: 1000
eval_every: 0
eval_num_inference_steps: 10

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null

output_dir: /datapool/lianjh/openwam/runs/bottle/easywam_bottle
