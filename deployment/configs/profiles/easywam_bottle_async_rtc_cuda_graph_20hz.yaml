model: easywam
version: bottle
worker:
  python: $DEPLOY/envs/easywam/bin/python
  script: $DEPLOY/src/easywam_worker.py
  cwd: $DEPLOY
  env:
    PYTHONPATH: $DEPLOY/src:$DEPLOY/vendor/easywam/src:$DEPLOY/vendor/easywam
    EASYWAM_COMPILE: '1'
    EASYWAM_FULLGRAPH: '0'
    OMP_NUM_THREADS: '2'
    MKL_NUM_THREADS: '2'
    EASYWAM_SMOOTH: '0'
    EASYWAM_SOFT_START: '0'
    EASYWAM_HAND_LEAD: '0'
    EASYWAM_HOLD_HANDS: '0'
    EASYWAM_HOLD_ARMS: '0'
    EASYWAM_STEPS: '10'
    EASYWAM_SEED: ''
    EASYWAM_EXECUTION_PROFILE: cuda_graph_fa2
  args:
    version: bottle
    device: cuda:0
    observation-endpoint: tcp://127.0.0.1:17200
    action-endpoint: tcp://127.0.0.1:17201
    control-endpoint: tcp://127.0.0.1:17202
    ready-file: $OUTPUT/worker_ready.json
    codec: $DEPLOY/vendor/bridge/codec.py
    warmup-fixtures: $DEPLOY/assets/references/bottle_observations
    image-resize: lanczos
    rtc: true
client:
  hz: 20
  sync: false
  prefetch_delay: 16
  duration: 0
  max_joint_step_deg: 0
  max_hand_step_deg: 2.0
  rtc_commit_steps: 14
  rtc_prefix_capacity: 24
  feedback_confirm_ms: 0
  arm_error_deg: 8
  hand_error_deg: 15
hardware:
  vel_ratio: 20
  acc_ratio: 20
client_entrypoint: confirmed_client.py
task: bottle
origin_reference: $DEPLOY/assets/references/bottle_demo_origin.json
rtc:
  mode: identity_vjp
  experimental: true
  validation_file: $DEPLOY/offline_checks/easywam_rtc20_20261108/validation.json
